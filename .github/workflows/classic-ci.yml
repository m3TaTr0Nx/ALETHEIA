name: Aletheia Classic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Smoke test root application
        run: |
          PORT=3210 node server.mjs > /tmp/aletheia.log 2>&1 &
          PID=$!
          trap "kill $PID" EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3210/ > /tmp/index.html; then
              break
            fi
            sleep 0.5
          done
          grep -q "Aletheia" /tmp/index.html
          grep -q "Use highlight" /tmp/index.html
          grep -q "Terminology sweep" /tmp/index.html
          ! grep -q "KEYSTREAM FABRIC" /tmp/index.html
          curl --fail --silent http://127.0.0.1:3210/apparatus > /tmp/apparatus.html
          grep -q "Aletheia Research Apparatus" /tmp/apparatus.html
          curl --fail --silent http://127.0.0.1:3210/api/apparatus/demo > /tmp/demo.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/demo.json','utf8')); if(d.minimumPairwiseSimilarity<=0.75) process.exit(1);"
