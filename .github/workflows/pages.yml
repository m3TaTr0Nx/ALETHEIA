name: Deploy Aletheia GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build:pages
      - run: npm run verify:pages
      - name: Upload downloadable static release
        uses: actions/upload-artifact@v4
        with:
          name: aletheia-static-release
          path: _site
          if-no-files-found: error
          retention-days: 30
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Explain pending Pages enablement
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository yet."
          echo "::notice::Repository admin: Settings > Pages > Build and deployment > Source: GitHub Actions."
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
